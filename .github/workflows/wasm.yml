# The bindings, built the way a host consumes them, then driven: the
# fixture book through a real worker thread, checked against the CLI
# that laid out the same manuscript in the same run, then through the
# tarball npm would publish. A release runs this workflow too, which is
# what makes the module it pushes the module that was tested.
name: wasm

on:
  workflow_call:
    inputs:
      ref:
        description: What to check out. A release that cut its own tag is not on the commit that started it.
        type: string
        default: ''
      tag:
        description: A tag every version has to agree with, when a release is what is running this.
        type: string
        default: ''

jobs:
  bindings:
    runs-on: ubuntu-latest
    env:
      WASM_PACK_VERSION: v0.15.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Before anything is built, let alone published: the crates, the
      # two packages and the peer range between them name one release.
      - name: One version everywhere
        run: node scripts/version.mjs ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            crates/fleuron-wasm/npm/package-lock.json
            packages/react/package-lock.json
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # wasm-pack fetches a matching wasm-bindgen on first use; keeping
      # it means the job pays for that once rather than every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ env.WASM_PACK_VERSION }}
      - name: Install wasm-pack
        run: |
          curl -sSfL -o wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar xf wasm-pack.tar.gz
          echo "$PWD/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build the module
        run: |
          wasm-pack build crates/fleuron-wasm --target web --release --no-pack \
            --out-dir npm/wasm --out-name fleuron
      - name: Build the package
        working-directory: crates/fleuron-wasm/npm
        run: npm ci && npm run build
      # The harness holds the module against the CLI: same page count,
      # same PDF, same text.
      - name: Build the CLI the harness compares against
        run: cargo build --release -p fleuron-cli
      - name: The fixture book through a worker
        working-directory: crates/fleuron-wasm/npm
        env:
          FLEURON_WASM_REQUIRE_TOOLS: "1"
        run: npm test
      # The painter needs a browser to be a painter. The same book, in
      # Chromium, with page one held against a raster of the PDF the
      # same run exported.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('crates/fleuron-wasm/npm/package-lock.json') }}
      - name: Install the browser
        working-directory: crates/fleuron-wasm/npm
        run: npx playwright install --with-deps chromium
      - name: The fixture book in a browser
        working-directory: crates/fleuron-wasm/npm
        env:
          FLEURON_WASM_REQUIRE_TOOLS: "1"
        run: npm run test:browser
      # The React wrapper is checked for what it does not contain.
      - name: The wrapper stays a wrapper
        working-directory: packages/react
        run: npm ci && npm test
      - name: Size budget
        working-directory: crates/fleuron-wasm/npm
        run: npm run size | tee -a "$GITHUB_STEP_SUMMARY"
      # The install a host does, out of the tarball npm would publish:
      # a directory that has never seen this repository, and the fixture
      # book out of it.
      - name: The fixture book out of an installed package
        working-directory: crates/fleuron-wasm/npm
        run: npm run test:package
      # What a release publishes is what this run built and drove, so
      # it is carried out of here rather than built again.
      - uses: actions/upload-artifact@v4
        with:
          name: package
          retention-days: 7
          path: |
            crates/fleuron-wasm/npm/dist
            crates/fleuron-wasm/npm/wasm
            packages/react/dist
