name: docs

# ci.yml is about the engine being correct. A docs build failing should
# read as a docs build failing, not as the engine going red.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'crates/**'
      - 'fixtures/**'
      - '.github/workflows/docs.yml'
  # `closed` is here for the preview: closing the pull request deletes
  # its folder.
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'crates/**'
      - 'fixtures/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The CLAUDE.md rule about `///` on every public item, enforced. The
  # lib crates deny missing docs; this catches everything else rustdoc
  # has to say.
  RUSTDOCFLAGS: -D warnings
  WASM_PACK_VERSION: v0.15.0

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            crates/fleuron-wasm/npm/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The demos run the engine, so the deploy builds one. From this
      # commit, which is what stops a stale artifact from being
      # served: there is nowhere else for the site to get a module.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ env.WASM_PACK_VERSION }}
      - name: Install wasm-pack
        run: |
          curl -sSfL -o wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar xf wasm-pack.tar.gz
          echo "$PWD/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build the module
        run: |
          wasm-pack build crates/fleuron-wasm --target web --release --no-pack \
            --out-dir npm/wasm --out-name fleuron
      - name: Build the package the site consumes
        working-directory: crates/fleuron-wasm/npm
        run: npm ci && npm run build

      - name: Install the site
        working-directory: site
        run: npm ci

      # Prose promises these run. They run.
      - name: The library quickstart
        run: cargo run --release --example quickstart -p fleuron

      - name: The CLI quickstart
        run: |
          cargo run --release -p fleuron-cli -- \
            fixtures/gulliver-excerpt.md -o cli.pdf -c fixtures/styled.css
          test -s cli.pdf

      # `--lib` and not the whole workspace: the CLI's bin target is
      # also called `fleuron` and would overwrite the library's docs at
      # the path the site serves them from.
      - name: Rustdoc
        run: cargo doc --workspace --no-deps --lib

      - name: Build the site
        working-directory: site
        run: npm run build

      # The demos, driven: every glyph an island paints is checked
      # against the structured output the worker sent it, and the landing
      # page is opened once with scripting off.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('site/package-lock.json') }}
      - name: Install the browser
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: The landing demo in a browser
        working-directory: site
        run: npm run demos:check

      - name: Fold the rustdoc in
        run: |
          cp -r target/doc site/dist/api
          cat > site/dist/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>fleuron API</title>
          <meta http-equiv="refresh" content="0; url=fleuron/">
          <a href="fleuron/">fleuron API documentation</a>
          HTML

      # A dotfile is left out of an artifact unless it is asked for, and
      # `.nojekyll` is what makes Pages serve `_astro/`.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site
          path: site/dist
          include-hidden-files: true
          retention-days: 1

      # The preview is a folder of the Pages site, so it is the same
      # site built again under that folder as its base. Everything
      # above checked the build that main deploys. A fork cannot push
      # to the Pages branch, so only a branch of this repository gets
      # a preview.
      - name: Build the preview
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: site
        env:
          SITE_BASE: /pr-preview/pr-${{ github.event.pull_request.number }}
        run: |
          npx astro build --outDir preview
          cp -r dist/api preview/api
      - uses: actions/upload-artifact@v4
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: preview
          path: site/preview
          retention-days: 1

  # Settings → Pages → Source must be the `gh-pages` branch, and the
  # `github-pages` environment must allow deployments from it; there is
  # no way to set either from a workflow.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The previews write the same branch.
    concurrency:
      group: pages-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist

      # Pages serves the gh-pages branch. The previews of open pull
      # requests live in its pr-preview folder, which a deploy keeps.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/dist
          clean-exclude: pr-preview/

      - name: Check the live docs
        run: |
          host="$(cat site/dist/CNAME)"
          for page in "" overview/ api/fleuron/; do
            for _ in $(seq 1 30); do
              curl -fsS "https://$host/$page" | grep -q "<title>" && continue 2
              sleep 10
            done
            echo "https://$host/$page did not load"
            exit 1
          done

  # A folder of the Pages site for the pull request, with a link in one
  # comment that every push updates. Closing the pull request deletes
  # the folder.
  preview:
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.build.result == 'success' || github.event.action == 'closed')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # The deploy on main writes the same branch.
    concurrency:
      group: pages-branch
      cancel-in-progress: false
    steps:
      # The action commits to the Pages branch from a clone.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: preview
          path: site/preview

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site/preview
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false

      - name: Say where the preview is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLOSED: ${{ github.event.action == 'closed' }}
        run: |
          MARKER='<!-- fleuron-docs-preview -->'
          url="https://$(cat site/public/CNAME)/pr-preview/pr-$PR/"
          {
            echo "$MARKER"
            if [ "$CLOSED" = true ]; then
              echo "The preview of this pull request is deleted."
            else
              echo "Preview of \`${HEAD_SHA:0:8}\`: [docs]($url) · [API](${url}api/fleuron/)"
            fi
          } > body.md

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | first | .id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@body.md --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md --silent
          fi
