# The one workflow that publishes, and a `v*` tag is the only thing that
# runs it. It runs the wasm workflow again, with the tag checked against
# every version in the repository, and the module and the built
# package come out of that run rather than being built a second time
# here. The crates go to crates.io and the packages to npm, each from a
# job of its own, so one registry's failure leaves the other's job to
# be run again alone.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  # The module built the way a host consumes it, the fixture book through
  # a worker and a browser, and the tarball installed into a directory
  # that has never seen this repository. A failure here is a release that
  # does not happen.
  checks:
    uses: ./.github/workflows/wasm.yml
    with:
      tag: ${{ github.ref_name }}

  # Every crate the workspace does not mark `publish = false`, in the
  # order they depend on each other.
  crates:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # crates.io trades the workflow's OIDC identity for a token that
      # lasts the job, so there is none in the repository's secrets.
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # A crate already on the registry at this version is a re-run of
      # a release that got some of them up, and crates.io refuses to
      # take one twice.
      - name: The crates, on the registry
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${TAG#v}"
          published=()
          missing=0
          for crate in $(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf -o /dev/null -A "fleuron release (github.com/zachhannum/fleuron)" \
              "https://crates.io/api/v1/crates/$crate/$version"; then
              published+=(--exclude "$crate")
            else
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            cargo publish --workspace "${published[@]}"
          fi

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # The release itself, and its assets signed back to the commit and
      # the run that built them. npm attests the tarballs it takes on its
      # own.
      contents: write
      attestations: write
      # npm authenticates the workflow over OIDC, so publishing needs no
      # token in the repository's secrets.
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .
      - name: The tarballs the release ships
        run: |
          mkdir -p release
          npm pack --pack-destination "$GITHUB_WORKSPACE/release" \
            ./crates/fleuron-wasm/npm ./packages/react
          cp crates/fleuron-wasm/npm/wasm/fleuron_bg.wasm release/
          ls -l release
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      # For a host that pins a file rather than the registry: both
      # tarballs and the module beside them.
      - name: On the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" release/* --clobber
      # Last of the two channels, because a release can be edited
      # afterwards and a published version cannot. Trusted publishing
      # signs each tarball with provenance without being asked.
      #
      # A version already on the registry is a re-run of a release that
      # got one package of the two up, and npm refuses to take it twice.
      - name: The bindings, on the registry
        working-directory: crates/fleuron-wasm/npm
        run: |
          npm view "$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')" version >/dev/null 2>&1 ||
            npm publish
      - name: The wrapper, on the registry
        working-directory: packages/react
        run: |
          npm view "$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')" version >/dev/null 2>&1 ||
            npm publish
