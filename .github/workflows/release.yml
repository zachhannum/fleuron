# The one workflow that publishes. A tag runs the wasm workflow again,
# with the tag held against every version the repository carries, and
# the module and the built package come out of that run rather than
# being built a second time here.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  # The release's own assets, signed back to the commit and the run that
  # built them. npm attests the tarballs it takes on its own.
  attestations: write
  # npm authenticates the workflow over OIDC, so publishing needs no
  # token in the repository's secrets.
  id-token: write

jobs:
  # A tag pushed with `GITHUB_TOKEN` starts no workflow run of its own, so
  # a dispatched release cannot hand off to the push trigger. It cuts the
  # tag here and the jobs below carry on with it.
  #
  # Separate from them so that re-running the failed half of a dispatched
  # release does not raise the version a second time.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: A credential the branch will take
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          [ -n "$RELEASE_TOKEN" ] || {
            echo "RELEASE_TOKEN is unset, and a dispatched release raises the version on a protected branch." >&2
            exit 1
          }
      # `main` takes no push from `GITHUB_TOKEN`: it is protected, and
      # the bot is nobody's administrator.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
          # The tag goes up under `GITHUB_TOKEN`, which starts no
          # workflow run. Under the token that pushed the branch it
          # would start a second release, racing this one to the
          # registry.
          TAG_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(node scripts/version.mjs --bump "$BUMP")
          git commit -am "Release v$version"
          git tag -a "v$version" -m "v$version"
          # The branch first. Two refs are not one push, and a tag whose
          # commit went nowhere is what the other order leaves behind.
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push "$TAG_REMOTE" "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # The module built the way a host consumes it, the fixture book through
  # a worker and a browser, and the tarball installed into a directory
  # that has never seen this repository. A failure here is a release that
  # does not happen.
  checks:
    needs: tag
    # `tag` is skipped for a tag push, which is not a failure.
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/wasm.yml
    with:
      ref: ${{ needs.tag.outputs.tag || github.ref_name }}
      tag: ${{ needs.tag.outputs.tag || github.ref_name }}

  publish:
    needs: [tag, checks]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .
      - name: The tarballs the release carries
        run: |
          mkdir -p release
          npm pack --pack-destination "$GITHUB_WORKSPACE/release" \
            ./crates/fleuron-wasm/npm ./packages/react
          cp crates/fleuron-wasm/npm/wasm/fleuron_bg.wasm release/
          ls -l release
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      # For a host that pins a file rather than the registry: both
      # tarballs and the module beside them.
      - name: On the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" release/* --clobber
      # Last of the two channels, because a release can be edited
      # afterwards and a published version cannot. Trusted publishing
      # signs each tarball with provenance without being asked.
      - name: The bindings, on the registry
        working-directory: crates/fleuron-wasm/npm
        run: npm publish
      - name: The wrapper, on the registry
        working-directory: packages/react
        run: npm publish
