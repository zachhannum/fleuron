name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Build CLI
        run: cargo build -p fleuron-cli --release
      - name: Run fixture book through the pipeline
        run: target/release/fleuron fixtures/book.json -o out.pdf
      - name: Structural check
        run: qpdf --check out.pdf
      - name: Text round-trip check
        run: |
          pdftotext out.pdf out.txt
          test "$(wc -w < out.txt)" -gt 0

  # Warns, does not fail: a shared runner's clock is evidence of a trend,
  # not of a regression. `--strict` is the switch to throw once the
  # numbers have held still. The memory ceiling is a hard failure — the
  # allocator counts the same bytes on every machine.
  perf:
    runs-on: ubuntu-latest
    env:
      WASMTIME_VERSION: v29.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Book-scale invariants
        run: cargo test --release -p fleuron-fixtures
      - name: Native budgets
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -p fleuron-fixtures --bin perf-gate -- --runs 3 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Install wasmtime
        run: |
          curl -sSfL -o wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar xf wasmtime.tar.xz
          echo "$PWD/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      # A standalone runtime, not a browser: the worker's real engine is
      # someone else's, and this is the closest reproducible proxy. Both
      # books, as natively — the constrained target is where a curve
      # that has stopped being linear shows up first.
      - name: Worker budgets
        run: |
          cargo build --release -p fleuron-fixtures --bin perf-gate --target wasm32-wasip1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          wasmtime run target/wasm32-wasip1/release/perf-gate.wasm -- --runs 3 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fleuron-wasm --target wasm32-unknown-unknown
