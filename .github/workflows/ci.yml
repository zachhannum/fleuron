name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: Build CLI
        run: cargo build -p fleuron-cli --release
      - name: Run fixture book through the pipeline
        run: target/release/fleuron fixtures/book.json -o out.pdf
      - name: Structural check
        run: qpdf --check out.pdf
      - name: Text round-trip check
        run: |
          pdftotext out.pdf out.txt
          test "$(wc -w < out.txt)" -gt 0

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fleuron-wasm --target wasm32-unknown-unknown
