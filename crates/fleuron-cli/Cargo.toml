[package]
name = "fleuron-cli"
description = "The fleuron binary: markdown and CSS in, a typeset PDF or a reflowable EPUB out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "fleuron"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json = "1"
fleuron.workspace = true
fleuron-markdown.workspace = true
fleuron-epub.workspace = true

[dev-dependencies]
# The e2e checks the fixture PDF against a digest; nothing ships with it.
sha2 = "0.10"
# The digest is taken over the display structure alone, so the e2e
# encodes it rather than reading the version off the front of a buffer.
postcard.workspace = true
# The links and the outline of the fixture PDF are read back through
# `qpdf --json`.
serde_json = "1"
# The EPUB the e2e writes is read back through its zip entries.
miniz_oxide.workspace = true
