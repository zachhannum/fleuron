[package]
name = "fleuron-wasm"
description = "WebAssembly bindings for fleuron: layout in a worker, display structure and PDF bytes out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fleuron = { path = "../fleuron" }
fleuron-markdown = { path = "../fleuron-markdown" }
wasm-bindgen = "0.2"
serde_json = "1"
