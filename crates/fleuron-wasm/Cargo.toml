[package]
name = "fleuron-wasm"
description = "WebAssembly bindings for fleuron: layout in a worker, display structure, PDF and EPUB bytes out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme.workspace = true
# The TypeScript beside the module ships to npm, not to crates.io.
exclude = ["npm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fleuron.workspace = true
fleuron-epub.workspace = true
fleuron-markdown.workspace = true
wasm-bindgen = "0.2"
serde_json = "1"

[dev-dependencies]
miniz_oxide.workspace = true
