[package]
name = "fleuron-fixtures"
description = "Fixture corpus and measurement harness: public-domain books as content trees, stage timings, and the budgets CI gates on"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "perf-gate"
path = "src/bin/perf-gate.rs"

# The tracker counts through a global allocator, so the tests that
# read it run alone in a process rather than beside a harness's
# threads.
[[test]]
name = "memory"
harness = false

[dependencies]
fleuron = { path = "../fleuron" }
pulldown-cmark.workspace = true
