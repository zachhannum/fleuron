[package]
name = "fleuron"
description = "Paged-media layout engine for book-shaped documents: style compilation, inline layout, fragmentation, page assembly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true

[dependencies]
cssparser.workspace = true
selectors.workspace = true
precomputed-hash.workspace = true
harfrust.workspace = true
skrifa.workspace = true
unicode-linebreak.workspace = true
unicode-bidi.workspace = true
hypher.workspace = true
icu_segmenter.workspace = true
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true
krilla.workspace = true

[dev-dependencies]
serde_json = "1"
insta = { version = "1", features = ["json"] }
proptest.workspace = true
criterion.workspace = true
# Dev-only, and a cycle only in the dev graph: the fixtures crate reads
# the corpus through this one.
fleuron-fixtures = { path = "../fleuron-fixtures" }
# The quickstart example reads a manuscript, the way the docs lead.
fleuron-markdown = { path = "../fleuron-markdown" }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "style"
harness = false

[[bench]]
name = "shape"
harness = false

[[bench]]
name = "line"
harness = false

[[bench]]
name = "fragment"
harness = false

[[bench]]
name = "paginate"
harness = false

[[bench]]
name = "pdf"
harness = false
