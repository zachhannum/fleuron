[workspace]
resolver = "2"
members = ["crates/fleuron", "crates/fleuron-cli", "crates/fleuron-wasm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zachhannum/fleuron"
authors = ["Zach Hannum"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }

# layout
harfrust = "0.13"
skrifa = "0.46"
unicode-linebreak = "0.1"
unicode-bidi = "0.3"
hypher = "0.1"
icu_segmenter = "2"

# pdf
krilla = { version = "0.5", default-features = false }

# diagnostics & errors
thiserror = "2"

# testing
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
