[workspace]
resolver = "2"
members = [
    "crates/fleuron",
    "crates/fleuron-cli",
    "crates/fleuron-fixtures",
    "crates/fleuron-markdown",
    "crates/fleuron-wasm",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zachhannum/fleuron"
homepage = "https://fleuron.typeworks.dev/"
documentation = "https://fleuron.typeworks.dev/api/fleuron/"
authors = ["Zach Hannum"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }

# style
cssparser = "0.37"
selectors = "0.40"
precomputed-hash = "0.1"

# layout
harfrust = "0.13"
skrifa = "0.46"
unicode-linebreak = "0.1"
unicode-bidi = "0.3"
# Only the English patterns: the one language the hyphenator asks for,
# and the other fifty ride into every binary that links it.
hypher = { version = "0.1", default-features = false, features = ["english"] }
icu_segmenter = "2"

# pdf. `raster-images` is the JPEG, PNG, GIF and WebP paths; the
# default `simple-text` is not, since the engine arrives with glyphs
# already shaped.
krilla = { version = "0.5", default-features = false, features = ["raster-images"] }

# diagnostics & errors
thiserror = "2"

# testing & measurement
proptest = "1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
