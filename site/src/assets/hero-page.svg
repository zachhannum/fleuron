<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 612" role="img" aria-label="Page 1 of Gulliver's Travels, typeset by fleuron" font-family="EB Garamond Subset, Garamond, serif" font-kerning="none" style="font-variant-ligatures:none" fill="currentColor">
<text x="60.00 74.20 90.40 104.24 115.28 128.68 139.96 154.22 158.22 165.02" y="70.09" font-size="20.00" font-weight="400">CHAPTER I.</text>
<text x="60.00 67.46 73.32 77.41 79.81 85.52 91.63 94.90 100.75 105.31 109.86 112.26 117.24 120.77 125.69 129.78 133.09 135.49 138.80 143.36 152.83 156.92 159.32 165.22 168.79 172.37 176.93 182.86 189.18 192.68 195.08 199.64 203.50 205.90 211.75 215.10 224.57 227.88 231.67 235.10 238.96 241.36 247.01 253.33 259.52 261.92 265.24 270.89 280.36 283.58 287.02 291.88 294.46 296.86 299.26 308.27 311.80 315.11 317.51 320.76 324.01 328.56 331.87" y="91.25" font-size="12.00" font-weight="400" font-style="italic">The author gives some account of himself and family.  His first</text>
<text x="60.00 63.35 69.67 75.86 81.73 85.31 89.40 98.87 102.96 109.28 112.79 116.10 118.50 122.00 126.56 128.96 132.47 136.54 142.43 147.35 151.14 154.57 157.15 159.55 161.95 170.96 175.06 177.46 180.98 184.30 186.70 189.83 195.68 199.03 204.30 211.78 216.32 220.42 223.93 229.39 233.48 239.68 242.26 244.66 250.31 256.63 262.82 265.22 268.54 276.01 279.36 288.83 292.14 294.54 298.39 302.95 307.50 309.90 315.76 319.28 322.60 325.00 328.43 331.96 335.81 339.90" y="109.25" font-size="12.00" font-weight="400" font-style="italic">inducements to travel.  He is shipwrecked, and swims for his life.</text>
<text x="60.00 68.24 72.34 75.84 79.15 81.55 84.86 90.76 94.61 98.70 101.10 105.66 111.98 114.38 117.52 123.37 127.93 132.48 136.57 138.97 142.32 148.64 151.04 154.31 160.16 164.26 166.66 170.23 174.79 180.72 187.04 190.55 195.10 199.96 202.36 206.92 210.77 213.17 220.16 223.39 226.64 230.08 233.42 238.69 244.80 248.30 250.88 253.28 256.81 260.12 262.52 271.99 277.88 284.08 288.17 290.57 296.46 298.86 304.13 308.68 312.20 315.52 320.08 326.40 330.49 335.04" y="127.25" font-size="12.00" font-weight="400" font-style="italic">Gets safe on shore in the country of Lilliput; is made a prisoner,</text>
<text x="60.00 65.65 71.98 78.17 80.57 84.32 89.98 94.52 99.07 102.36 106.45 112.64 115.04 120.97 126.24 128.64 131.90 137.76 141.85 144.25 147.83 152.39 158.32 164.64 168.14 172.69 177.55" y="145.25" font-size="12.00" font-weight="400" font-style="italic">and carried up the country.</text>
<text x="60.00 70.33 75.59 77.99 81.50 86.29 90.06 96.24 100.92 104.93 107.33 113.51 118.30 124.37 126.77 131.56 133.96 137.83 147.17 151.96 154.84 157.72 160.12 164.80 168.67 172.44 177.23 181.00 185.68 188.08 191.02 197.35 199.75 209.26 215.20 218.96 222.73 225.67 232.01 237.23 243.41 248.20 257.53 261.41 267.59 270.53 274.54 279.22 282.19 284.59 288.67 291.07 299.11 303.90 307.78 310.18 313.94 320.12 324.80 327.20 330.97 337.15 340.09 344.10" y="163.25" font-size="12.00" font-weight="400">My father had a small estate in Nottinghamshire: I was the third</text>
<text x="60.00 65.94 69.76 72.16 75.26 78.37 83.33 88.01 90.41 94.28 100.22 106.56 110.44 113.20 115.60 118.00 127.72 132.40 134.80 138.67 143.35 149.69 153.46 155.86 165.19 169.87 172.27 176.04 181.98 184.38 191.15 200.48 205.27 211.61 217.93 222.61 225.49 227.89 236.41 242.17 245.05 247.93 252.61 257.83 262.51 264.91 267.85 274.19 276.59 285.11 289.90 299.23 305.41 309.42 312.36 318.43 323.65 328.33 330.73 335.52" y="181.25" font-size="12.00" font-weight="400">of five sons.  He sent me to Emanuel College in Cambridge at</text>
<text x="60.00 63.52 69.46 75.78 79.79 83.56 88.12 92.80 99.13 101.53 106.49 111.17 115.96 119.96 123.84 126.24 132.00 134.88 140.95 143.71 146.11 154.33 160.51 165.19 169.20 173.88 176.28 180.36 182.76 186.77 191.45 195.32 198.26 204.34 208.90 214.97 217.37 221.14 227.32 231.32 235.88 240.56 242.96 247.92 252.60 257.39 261.40 265.27 268.03 270.43 275.22 281.56 287.63 290.03 294.82 301.04 307.09 309.97 312.91 317.47 323.54 325.94 334.80 340.06 343.93 348.61 351.49" y="199.25" font-size="12.00" font-weight="400">fourteen years old, where I resided three years, and applied myself</text>
<text x="60.00 64.88 67.76 73.70 77.58 82.26 84.66 88.43 94.37 96.77 105.62 110.88 113.28 117.16 120.92 127.25 133.32 136.26 140.94 144.82 147.55 149.95 156.13 162.46 166.22 168.62 172.39 178.57 183.25 185.65 190.54 196.72 201.50 205.51 210.73 215.41 217.81 223.75 227.57 229.97 239.30 244.09 247.03 253.37 257.14 261.92 264.86 271.20 274.14 280.48 285.70 288.10 297.43 302.11 304.87 307.27 312.06 314.94 318.71 324.89 330.83 337.15 342.37 348.55 350.95" y="217.25" font-size="12.00" font-weight="400">close to my studies; but the charge of maintaining me, although I</text>
<text x="60.00 66.18 70.97 77.04 79.44 84.23 86.63 91.58 96.26 100.27 105.53 107.93 111.80 116.51 121.30 127.63 131.40 136.66 139.06 143.84 146.72 149.60 155.36 163.40 168.19 174.53 179.17 183.85 186.61 189.01 195.19 199.87 202.81 209.15 214.37 216.77 220.54 226.48 232.42 234.82 240.04 244.04 248.72 253.51 257.28 259.68 263.20 269.14 273.14 275.54 280.33 282.73 289.07 293.86 297.86 301.87 307.63 315.85 318.25 321.77 327.71 331.72 335.48 341.81 348.14 352.82" y="235.25" font-size="12.00" font-weight="400">had a very scanty allowance, being too great for a narrow fortune,</text>
<text x="60.00 64.08 66.48 74.52 79.31 83.18 85.58 91.76 97.70 104.03 110.36 116.44 118.84 123.62 129.85 136.08 140.09 144.77 151.10 154.87 157.81 162.46 167.14 169.54 173.30 179.24 181.64 192.46 196.46 199.22 201.62 205.70 210.49 219.83 224.51 228.38 230.78 237.83 242.62 246.38 251.06 254.94 257.70 260.10 264.89 271.22 273.62 278.30 287.64 290.58 296.92 301.60 307.93 311.70 314.10 317.98 324.30 328.31 333.53 338.09 344.03" y="253.25" font-size="12.00" font-weight="400">I was bound apprentice to Mr. James Bates, an eminent surgeon</text>
<text x="60.00 62.94 69.28 71.68 78.68 84.62 90.96 97.03 102.97 109.31 112.07 114.47 122.69 125.63 129.40 135.58 137.98 146.20 152.38 158.32 167.65 170.05 174.13 176.53 181.18 187.12 193.45 197.22 200.16 206.50 212.82 217.38 223.45 225.85 229.37 235.31 241.63 245.64 248.04 253.00 257.68 262.46 266.47 270.35 273.11 275.51 277.91 288.24 293.50 295.90 299.41 304.20 307.97 314.15 318.83 322.84 325.24 331.57 337.33" y="271.25" font-size="12.00" font-weight="400">in London, with whom I continued four years.  My father now</text>
<text x="60.00 64.79 71.12 77.20 79.60 83.36 89.54 94.22 100.56 102.96 106.84 111.52 117.85 123.92 126.86 133.20 138.42 140.82 150.16 154.84 157.24 161.11 170.45 175.24 178.12 181.00 183.40 187.27 193.60 202.93 206.81 209.21 215.15 218.96 221.36 230.70 236.64 242.98 247.66 252.07 254.83 257.23 261.31 263.71 266.59 271.38 274.32 280.39 282.79 286.56 292.74 297.42 306.76 309.16 315.10 321.42 325.19 327.59 330.53" y="289.25" font-size="12.00" font-weight="400">and then sending me small sums of money, I laid them out in</text>
<text x="60.00 62.88 67.56 72.35 76.36 82.69 85.63 91.97 97.19 99.59 105.92 110.47 115.73 118.67 123.89 128.68 132.44 135.38 141.32 147.66 150.42 152.82 157.61 163.94 170.02 172.42 178.36 182.12 188.30 192.98 196.99 199.39 205.38 210.17 214.18 217.94 221.82 224.22 230.16 233.98 236.38 240.14 246.32 251.00 253.40 262.74 267.53 271.30 277.48 282.16 291.49 296.28 300.05 302.99 307.87 311.75 314.51 316.91 323.23 327.11 331.79 335.60 341.93" y="307.25" font-size="12.00" font-weight="400">learning navigation, and other parts of the mathematics, useful</text>
<text x="60.00 63.77 69.71 72.11 75.88 82.06 88.00 91.87 96.55 98.95 107.17 113.35 119.29 121.69 124.63 130.97 134.74 139.42 145.75 151.82 154.22 157.99 163.93 166.33 170.10 174.11 178.66 183.61 188.29 191.17 193.93 196.33 201.12 205.00 207.40 211.48 213.88 218.66 221.54 229.58 234.25 239.51 243.38 245.78 251.96 256.64 259.52 262.46 267.14 272.10 276.66 282.73 285.13 288.07 291.84 294.24 302.16 308.10 314.42 317.30 323.38 325.78 331.96 336.64" y="325.25" font-size="12.00" font-weight="400">to those who intend to travel, as I always believed it would be,</text>
<text x="60.00 63.88 69.82 79.15 83.83 86.23 90.00 92.94 102.28 106.96 109.36 115.30 119.30 121.70 127.64 131.41 137.59 142.27 146.28 149.04 151.44 160.30 165.55 167.95 171.47 177.41 181.42 185.18 191.51 197.84 202.52 204.92 208.69 214.63 217.03 223.10 228.74 231.50 233.90 236.30 247.30 253.48 258.16 264.49 266.89 270.97 273.37 276.25 280.93 284.75 288.52 290.92 301.73 305.74 308.50 310.90 317.94 322.73 326.50 331.18 335.05 337.81 340.21" y="343.25" font-size="12.00" font-weight="400">some time or other, my fortune to do.  When I left Mr. Bates, I</text>
<text x="60.00 67.92 72.60 78.94 82.70 85.10 91.18 96.94 105.16 111.49 113.89 117.66 123.60 126.00 134.86 140.11 142.51 146.03 150.82 154.58 160.76 165.44 169.45 172.43 174.83 183.05 189.23 193.91 197.92 202.60 205.36 207.76 213.64 218.89 221.29 225.06 231.24 235.92 238.32 243.11 246.98 250.86 253.80 257.68 261.44 266.23 272.57 277.21 281.89 284.29 290.23 294.05 296.45 302.63 305.57 314.90 317.30 322.09 328.43 334.50 336.90 345.76" y="361.25" font-size="12.00" font-weight="400">went down to my father: where, by the assistance of him and my</text>
<text x="60.00 66.32 72.66 77.54 80.42 85.10 87.50 91.58 97.34 103.52 109.86 112.62 115.02 119.81 126.14 132.22 134.62 138.49 144.43 153.77 158.45 160.85 166.79 170.56 176.74 181.42 185.42 187.82 191.83 196.51 199.39 204.18 207.95 210.89 216.83 223.16 227.04 229.80 232.20 236.28 238.68 243.90 249.84 253.61 256.01 259.52 265.46 269.47 273.24 278.50 280.90 287.12 293.06 299.39 305.72 311.80 315.67 318.43 320.83 325.62 331.96 338.03 340.43" y="379.25" font-size="12.00" font-weight="400">uncle John, and some other relations, I got forty pounds, and a</text>
<text x="60.00 66.23 70.24 76.18 85.51 88.45 92.33 97.01 99.41 105.35 109.16 111.56 115.33 121.51 124.45 128.46 132.23 137.48 139.88 146.11 152.05 158.38 164.71 170.78 174.66 177.06 181.85 184.25 189.20 193.88 198.67 202.68 205.08 208.85 214.79 217.19 226.52 231.31 234.25 240.59 244.36 249.14 252.08 258.42 260.82 270.16 274.84 277.24 282.02 285.79 288.19 295.20 299.88 304.84 310.91 315.59 321.92 324.90 327.30 331.07 337.25 341.93 345.94" y="397.25" font-size="12.00" font-weight="400">promise of thirty pounds a year to maintain me at Leyden: there</text>
<text x="60.00 64.08 66.48 70.36 74.12 80.45 86.52 89.46 94.02 100.09 102.49 108.54 114.24 119.50 123.37 126.31 131.20 133.60 137.36 145.28 151.22 153.62 158.58 163.26 168.05 172.06 175.93 178.33 183.12 189.46 195.53 197.93 201.80 206.48 211.44 216.12 222.46 224.86 234.19 240.13 246.47 250.24 256.42 260.29 263.05 265.45 271.08 277.42 283.18 291.40 294.34 300.67 305.89 308.29 311.23 315.00 317.40 325.32 331.26 337.58 340.46" y="415.25" font-size="12.00" font-weight="400">I studied physic two years and seven months, knowing it would</text>
<text x="60.00 66.18 70.86 73.26 79.58 83.46 88.14 91.96 98.28 101.16 103.56 106.50 112.84 115.24 118.12 124.06 130.39 135.61 138.01 142.97 148.61 153.68 158.47 163.69 168.37 172.25" y="433.25" font-size="12.00" font-weight="400">be useful in long voyages.</text>
<text x="60.00 65.58 71.52 77.46 83.80 86.20 90.98 94.80 98.57 103.25 107.26 109.66 118.51 123.77 126.17 130.18 134.86 138.62 144.95 148.96 155.29 157.69 161.51 165.52 171.46 180.79 183.19 190.20 194.88 199.84 205.91 210.59 216.92 219.68 222.08 226.16 228.56 236.60 241.39 245.27 247.67 251.68 256.24 260.88 266.82 276.16 285.49 290.17 296.51 302.58 307.14 313.21 315.61 321.49 326.75 329.15 338.00" y="451.25" font-size="12.00" font-weight="400">Soon after my return from Leyden, I was recommended by my</text>
<text x="60.00 65.22 71.16 77.10 83.17 85.57 94.91 99.70 103.57 107.34 112.02 116.03 118.79 121.19 132.00 136.01 138.77 141.17 148.21 153.00 156.77 161.45 165.32 168.08 170.48 174.25 180.19 182.59 188.77 193.45 195.85 199.73 206.05 210.06 215.28 219.84 225.78 232.12 234.52 238.28 244.22 246.62 250.39 256.57 261.25 263.65 269.23 277.27 282.06 284.94 287.82 293.58 300.96 303.72 306.12 314.64 319.43 325.66 329.42 334.21 337.15" y="469.25" font-size="12.00" font-weight="400">good master, Mr. Bates, to be surgeon to the Swallow, Captain</text>
<text x="60.00 68.30 74.48 78.49 83.28 89.46 94.25 103.58 105.98 112.01 116.80 123.13 129.47 134.15 137.03 139.79 142.19 146.83 152.77 162.11 171.44 176.23 182.57 188.64 193.32 197.33 200.06 202.46 210.68 213.62 217.39 223.57 225.97 234.19 240.37 246.31 255.65 258.05 262.13 264.53 269.17 275.11 281.45 285.22 288.16 294.49 300.82 305.38 311.45 313.85 317.62 323.80 327.80 332.36" y="487.25" font-size="12.00" font-weight="400">Abraham Pannel, commander; with whom I continued three</text>
<text x="60.00 64.96 69.64 74.42 78.43 82.31 84.71 89.50 95.83 101.90 104.30 109.09 111.49 117.67 122.46 125.34 129.16 131.92 134.32 143.65 148.44 154.07 157.01 163.34 168.56 170.96 175.75 178.15 183.11 188.75 193.82 198.61 203.83 208.51 210.91 216.85 220.86 223.26 227.03 234.95 240.89 243.29 246.23 252.56 256.33 262.27 264.67 268.44 274.62 279.30 281.70 288.71 293.39 298.46 303.25 309.59 313.36 316.12 318.52 323.30 329.64" y="505.25" font-size="12.00" font-weight="400">years and a half, making a voyage or two into the Levant, and</text>
<text x="60.00 63.88 69.82 79.15 83.83 86.23 92.17 95.94 102.12 106.80 110.81 113.21 119.20 123.98 127.99 131.76 135.64 138.40 140.80 143.20 154.19 160.37 165.05 171.38 173.78 177.86 180.26 184.97 189.76 199.09 203.77 206.17 212.11 216.90 221.78 227.41 229.81 233.89 236.29 240.30 244.98 248.86 254.62 257.50 262.45 267.01 273.08 275.48 279.25 285.19 287.59 291.47 296.15 299.92 303.68 306.56 311.24 313.64 316.58" y="523.25" font-size="12.00" font-weight="400">some other parts.  When I came back I resolved to settle in</text>
<text x="60.00 67.01 72.95 79.28 85.36 91.30 97.63 100.37 102.77 106.54 112.48 114.88 123.10 129.28 132.22 137.10 143.28 145.68 156.49 160.50 163.26 165.66 172.70 177.49 181.26 185.94 189.82 192.58 194.98 203.83 209.09 211.49 220.82 225.61 229.49 233.26 237.94 241.94 244.70 247.10 251.78 258.12 262.76 268.70 275.03 279.04 283.82 289.04 293.60 299.68 302.08 311.41 316.09 318.85 321.25 326.04 332.38 338.45 340.85 346.73" y="541.25" font-size="12.00" font-weight="400">London; to which Mr. Bates, my master, encouraged me, and by</text>
<text x="158.70 162.42 167.78 172.40 177.07 181.58 187.62 189.22 193.75 198.38 199.98 204.07 208.74 213.26 219.16 224.86 230.97" y="26.84" font-size="8.00" font-weight="400">STYLED BY FLEURON</text>
<text x="196.08" y="586.84" font-size="8.00" font-weight="400">1</text>
</svg>
